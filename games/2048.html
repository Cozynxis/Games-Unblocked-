<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tile Merge • Games Unblocked</title><style>*{box-sizing:border-box}body{margin:0;background:#100d0b;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.wrap{width:min(760px,calc(100% - 24px))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.left{display:flex;gap:10px;align-items:center}.back,.btn{border:1px solid rgba(255,255,255,.1);background:#1b1512;color:#fff;border-radius:12px;padding:10px 13px;text-decoration:none;cursor:pointer}.title strong{display:block}.title span{font-size:10px;color:#9d8e86}.stats{display:flex;gap:8px}.stat{background:#1b1512;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;min-width:76px;text-align:center}.stat span{display:block;color:#9d8e86;font-size:9px}.board-wrap{border:1px solid rgba(255,255,255,.08);background:#1c1511;padding:14px;border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.45)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;aspect-ratio:1/1;background:#261c17;padding:12px;border-radius:18px}.cell{border-radius:14px;background:#34251f;display:grid;place-items:center;font-weight:900;font-size:clamp(24px,7vw,54px);letter-spacing:-.05em;color:#fff;transition:.1s}.v2{background:#5b493e}.v4{background:#6f5441}.v8{background:#c8753e}.v16{background:#dd6a34}.v32{background:#e54f38}.v64{background:#e9352e}.v128{background:#c39c3b}.v256{background:#d3a52f}.v512{background:#e0b62b}.v1024{background:#efc72e}.v2048{background:#ffd447;color:#2b210c;box-shadow:0 0 35px rgba(255,212,71,.35)}.hint{text-align:center;color:#8f7f76;font-size:11px;margin-top:14px}.actions{display:flex;justify-content:center;margin-top:12px}.overlay{position:fixed;inset:0;background:rgba(10,7,5,.68);backdrop-filter:blur(7px);display:none;place-items:center}.modal{background:#1c1511;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px;text-align:center;min-width:280px}.modal h1{margin:0 0 7px}.modal p{color:#9d8e86}.play{border:0;background:linear-gradient(135deg,#f6bd42,#ef7e3a);color:#29180b;font-weight:900;border-radius:12px;padding:12px 18px;cursor:pointer}@media(max-width:540px){.title{display:none}.board{gap:8px;padding:8px}.cell{border-radius:10px}}</style></head><body><main class="wrap"><div class="top"><div class="left"><a class="back" href="../index.html">← Library</a><div class="title"><strong>Tile Merge</strong><span>Puzzle</span></div></div><div class="stats"><div class="stat"><span>SCORE</span><strong id="score">0</strong></div><div class="stat"><span>BEST</span><strong id="best">0</strong></div></div></div><div class="board-wrap"><div id="board" class="board"></div></div><div class="actions"><button class="btn" id="restart">New game</button></div><div class="hint">Arrow keys / WASD • Merge equal tiles • Reach 2048</div></main><div class="overlay" id="overlay"><div class="modal"><h1>No more moves</h1><p id="final"></p><button class="play" id="again">Play again</button></div></div><script>const size=4,boardEl=document.getElementById('board'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');let grid,score=0,best=+localStorage.getItem('gu-merge-best')||0;bestEl.textContent=best;function emptyGrid(){return Array.from({length:size},()=>Array(size).fill(0))}function empties(){const a=[];for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(!grid[r][c])a.push([r,c]);return a}function addTile(){const e=empties();if(!e.length)return;const [r,c]=e[Math.floor(Math.random()*e.length)];grid[r][c]=Math.random()<.9?2:4}function start(){grid=emptyGrid();score=0;scoreEl.textContent=0;addTile();addTile();render();overlay.style.display='none'}function render(){boardEl.innerHTML='';for(let r=0;r<size;r++)for(let c=0;c<size;c++){const v=grid[r][c],d=document.createElement('div');d.className='cell '+(v?'v'+Math.min(v,2048):'');d.textContent=v||'';boardEl.appendChild(d)}}function compress(row){let arr=row.filter(Boolean),out=[];for(let i=0;i<arr.length;i++){if(arr[i]===arr[i+1]){const v=arr[i]*2;out.push(v);score+=v;i++}else out.push(arr[i])}while(out.length<size)out.push(0);return out}function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}function transpose(m){return m[0].map((_,i)=>m.map(r=>r[i]))}function move(dir){const old=grid.map(r=>[...r]);if(dir==='left')grid=grid.map(compress);if(dir==='right')grid=grid.map(r=>compress([...r].reverse()).reverse());if(dir==='up'){grid=transpose(grid).map(compress);grid=transpose(grid)}if(dir==='down'){grid=transpose(grid).map(r=>compress([...r].reverse()).reverse());grid=transpose(grid)}if(!same(old,grid)){addTile();scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('gu-merge-best',best)}render();if(!canMove())end()}}function canMove(){if(empties().length)return true;for(let r=0;r<size;r++)for(let c=0;c<size;c++){if(c<size-1&&grid[r][c]===grid[r][c+1])return true;if(r<size-1&&grid[r][c]===grid[r+1][c])return true}return false}function end(){final.textContent='Final score: '+score;overlay.style.display='grid'}document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),map={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};if(map[k]){e.preventDefault();move(map[k])}});let sx=0,sy=0;boardEl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});boardEl.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});restart.onclick=start;again.onclick=start;start();</script></body></html>
