<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#100d0b"><title>Tile Merge • Games Unblocked</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100d0b;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;overflow:hidden}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 20%,rgba(246,189,66,.11),transparent 34%),linear-gradient(#100d0b,#17100d)}.wrap{width:min(760px,calc(100% - 24px));padding:12px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}.left{display:flex;gap:10px;align-items:center}.back,.btn{border:1px solid rgba(255,255,255,.1);background:#1b1512;color:#fff;border-radius:12px;padding:10px 13px;text-decoration:none;cursor:pointer;transition:.2s}.back:hover,.btn:hover{background:#271d18;transform:translateY(-2px)}.title strong{display:block}.title span{font-size:10px;color:#9d8e86}.stats{display:flex;gap:8px}.stat{background:#1b1512;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;min-width:76px;text-align:center}.stat span{display:block;color:#9d8e86;font-size:9px}.board-wrap{border:1px solid rgba(255,255,255,.08);background:#1c1511;padding:14px;border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.45)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;aspect-ratio:1/1;background:#261c17;padding:12px;border-radius:18px;touch-action:none}.cell{border-radius:14px;background:#34251f;display:grid;place-items:center;font-weight:900;font-size:clamp(24px,7vw,54px);letter-spacing:-.05em;color:#fff;transition:transform .12s,background .2s;animation:appear .18s ease both}.cell.pop{animation:pop .22s cubic-bezier(.2,.9,.3,1.3)}.v2{background:#5b493e}.v4{background:#6f5441}.v8{background:#c8753e}.v16{background:#dd6a34}.v32{background:#e54f38}.v64{background:#e9352e}.v128{background:#c39c3b}.v256{background:#d3a52f}.v512{background:#e0b62b}.v1024{background:#efc72e}.v2048{background:#ffd447;color:#2b210c;box-shadow:0 0 35px rgba(255,212,71,.35)}.v4096,.v8192{background:linear-gradient(135deg,#ffdf63,#ff8d47);color:#281808;box-shadow:0 0 42px rgba(255,166,70,.35)}.hint{text-align:center;color:#8f7f76;font-size:11px;margin-top:14px}.actions{display:flex;justify-content:center;gap:8px;margin-top:12px}.overlay{position:fixed;inset:0;background:rgba(10,7,5,.72);backdrop-filter:blur(8px);display:none;place-items:center;z-index:10}.overlay.show{display:grid}.modal{background:#1c1511;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px;text-align:center;min-width:280px;box-shadow:0 30px 90px rgba(0,0,0,.5);animation:modal .25s ease}.modal h1{margin:0 0 7px}.modal p{color:#9d8e86}.play{border:0;background:linear-gradient(135deg,#f6bd42,#ef7e3a);color:#29180b;font-weight:900;border-radius:12px;padding:12px 18px;cursor:pointer}.score-bump{animation:score .2s ease}@keyframes appear{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.12)}100%{transform:scale(1)}}@keyframes modal{from{opacity:0;transform:translateY(10px) scale(.97)}}@keyframes score{50%{transform:scale(1.14);color:#ffd447}}@media(max-width:540px){.title{display:none}.board{gap:8px;padding:8px}.cell{border-radius:10px}.stat{min-width:58px;padding:8px}.stats{gap:5px}.hint{font-size:9px}.btn{padding:9px 11px}}
</style></head>
<body><div class="bg"></div><main class="wrap"><div class="top"><div class="left"><a class="back" href="../index.html">← Library</a><div class="title"><strong>Tile Merge</strong><span>Puzzle • logic</span></div></div><div class="stats"><div class="stat"><span>SCORE</span><strong id="score">0</strong></div><div class="stat"><span>BEST</span><strong id="best">0</strong></div></div></div><div class="board-wrap"><div id="board" class="board"></div></div><div class="actions"><button class="btn" id="undo">↶ Undo</button><button class="btn" id="restart">New game</button></div><div class="hint">Arrow keys / WASD / swipe • Merge equal tiles • Reach 2048</div></main><div class="overlay" id="overlay"><div class="modal"><h1 id="modalTitle">No more moves</h1><p id="final"></p><button class="play" id="again">Play again</button></div></div>
<script>
(()=>{'use strict';
const SIZE=4,boardEl=document.getElementById('board'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),finalEl=document.getElementById('final'),modalTitle=document.getElementById('modalTitle');let grid,score=0,best=Number(localStorage.getItem('gu-merge-best'))||0,previous=null,newCells=new Set(),mergedCells=new Set(),won=false,touchStart=null;bestEl.textContent=best;
const copy=m=>m.map(r=>[...r]);const emptyGrid=()=>Array.from({length:SIZE},()=>Array(SIZE).fill(0));
function empties(){const out=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!grid[r][c])out.push([r,c]);return out}
function addTile(){const cells=empties();if(!cells.length)return;const [r,c]=cells[Math.floor(Math.random()*cells.length)];grid[r][c]=Math.random()<.9?2:4;newCells.add(`${r}-${c}`)}
function saveBest(){if(score>best){best=score;bestEl.textContent=String(best);localStorage.setItem('gu-merge-best',String(best))}}
function start(){grid=emptyGrid();score=0;previous=null;won=false;newCells.clear();mergedCells.clear();scoreEl.textContent='0';addTile();addTile();render();overlay.classList.remove('show')}
function render(){boardEl.innerHTML='';for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const v=grid[r][c],cell=document.createElement('div');const cap=v?Math.min(v,8192):0;cell.className=`cell ${v?'v'+cap:''} ${(newCells.has(`${r}-${c}`)||mergedCells.has(`${r}-${c}`))?'pop':''}`;cell.textContent=v||'';cell.setAttribute('aria-label',v?`Tile ${v}`:'Empty tile');boardEl.appendChild(cell)}newCells.clear();mergedCells.clear()}
function compress(row,rowIndex,vertical=false){const entries=row.map((v,i)=>({v,i})).filter(e=>e.v);const out=[];for(let i=0;i<entries.length;i++){if(entries[i+1]&&entries[i].v===entries[i+1].v){const value=entries[i].v*2;out.push(value);score+=value;i++}else out.push(entries[i].v)}while(out.length<SIZE)out.push(0);return out}
const transpose=m=>m[0].map((_,i)=>m.map(r=>r[i]));const same=(a,b)=>a.every((r,ri)=>r.every((v,ci)=>v===b[ri][ci]));
function move(dir){const old=copy(grid),oldScore=score;previous={grid:old,score:oldScore};mergedCells.clear();if(dir==='left')grid=grid.map((r,ri)=>compress(r,ri));if(dir==='right')grid=grid.map((r,ri)=>compress([...r].reverse(),ri).reverse());if(dir==='up'){grid=transpose(grid).map((r,ri)=>compress(r,ri,true));grid=transpose(grid)}if(dir==='down'){grid=transpose(grid).map((r,ri)=>compress([...r].reverse(),ri,true).reverse());grid=transpose(grid)}if(same(old,grid)){previous=null;score=oldScore;return}for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]&&grid[r][c]!==old[r][c])mergedCells.add(`${r}-${c}`);addTile();scoreEl.textContent=String(score);scoreEl.classList.remove('score-bump');void scoreEl.offsetWidth;scoreEl.classList.add('score-bump');saveBest();render();if(!won&&grid.some(row=>row.some(v=>v>=2048))){won=true;modalTitle.textContent='2048 reached!';finalEl.textContent=`Score: ${score}. You can keep playing after closing this.`;overlay.classList.add('show');document.getElementById('again').textContent='Keep playing'}else if(!canMove())end()}
function canMove(){if(empties().length)return true;for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(c<SIZE-1&&grid[r][c]===grid[r][c+1])return true;if(r<SIZE-1&&grid[r][c]===grid[r+1][c])return true}return false}
function end(){modalTitle.textContent='No more moves';finalEl.textContent=`Final score: ${score} • Best: ${best}`;document.getElementById('again').textContent='Play again';overlay.classList.add('show')}
function undo(){if(!previous)return;grid=copy(previous.grid);score=previous.score;scoreEl.textContent=String(score);previous=null;newCells.clear();mergedCells.clear();render()}
const mapping={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};document.addEventListener('keydown',e=>{const dir=mapping[e.key.toLowerCase()];if(dir){e.preventDefault();move(dir)}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}});boardEl.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY}});boardEl.addEventListener('pointerup',e=>{if(!touchStart)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});document.getElementById('restart').onclick=start;document.getElementById('undo').onclick=undo;document.getElementById('again').onclick=()=>{if(won&&canMove()){overlay.classList.remove('show')}else start()};start();})();
</script></body></html>
