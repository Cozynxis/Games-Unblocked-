<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astro Blaster</title><style>*{box-sizing:border-box}body{margin:0;background:#070a1b;color:#fff;font-family:system-ui;min-height:100vh;display:grid;place-items:center}.wrap{width:min(900px,calc(100% - 20px))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.back,.stat{background:#121735;border:1px solid #ffffff18;color:#fff;border-radius:12px;padding:10px 13px;text-decoration:none}.stage{position:relative;border:1px solid #ffffff1a;border-radius:20px;padding:10px;background:#0c1027;box-shadow:0 24px 70px #0008}canvas{display:block;width:100%;aspect-ratio:16/10;background:radial-gradient(circle at 50% 70%,#1b285f,#080b1d 55%);border-radius:14px}.overlay{position:absolute;inset:10px;display:grid;place-items:center;background:#060817c9;border-radius:14px;text-align:center}.overlay h1{font-size:42px;margin:0}.overlay p{color:#aab3d2}.play{border:0;background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#fff;font-weight:900;border-radius:12px;padding:12px 18px;cursor:pointer}.hint{text-align:center;color:#7f8ab1;font-size:12px;margin-top:10px}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../index.html">← Games</a><div><span class="stat">Score <b id="score">0</b></span> <span class="stat">Lives <b id="lives">3</b></span></div></div><div class="stage"><canvas id="c" width="960" height="600"></canvas><div id="overlay" class="overlay"><div><h1>🚀 Astro Blaster</h1><p>Move, shoot and survive the meteor storm.</p><button id="start" class="play">Launch</button></div></div></div><div class="hint">WASD / arrows to move • SPACE to shoot • drag on mobile</div></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),overlay=document.getElementById('overlay');let ship,shots,rocks,stars,parts,keys={},score,lives,running,last,spawn;function reset(){ship={x:480,y:515,r:22};shots=[];rocks=[];parts=[];stars=Array.from({length:80},()=>({x:Math.random()*960,y:Math.random()*600,s:1+Math.random()*2}));score=0;lives=3;spawn=0;scoreEl.textContent=0;livesEl.textContent=3;last=performance.now()}function shoot(){if(!running)return;if(shots.length<7)shots.push({x:ship.x,y:ship.y-28,vy:-650})}function boom(px,py,col){for(let i=0;i<14;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,a:1,c:col})}function update(dt){let s=390;if(keys.arrowleft||keys.a)ship.x-=s*dt;if(keys.arrowright||keys.d)ship.x+=s*dt;if(keys.arrowup||keys.w)ship.y-=s*dt;if(keys.arrowdown||keys.s)ship.y+=s*dt;ship.x=Math.max(28,Math.min(932,ship.x));ship.y=Math.max(60,Math.min(565,ship.y));stars.forEach(st=>{st.y+=45*st.s*dt;if(st.y>610){st.y=-5;st.x=Math.random()*960}});shots.forEach(b=>b.y+=b.vy*dt);shots=shots.filter(b=>b.y>-30);spawn-=dt;if(spawn<=0){let r=18+Math.random()*26;rocks.push({x:40+Math.random()*880,y:-40,r,vy:130+Math.random()*100+score*.08,vx:(Math.random()-.5)*40});spawn=.42+Math.random()*.55}rocks.forEach(r=>{r.y+=r.vy*dt;r.x+=r.vx*dt});for(const b of shots){for(const r of rocks){if(!r.dead&&!b.dead&&Math.hypot(b.x-r.x,b.y-r.y)<r.r+5){r.dead=b.dead=true;score+=10;scoreEl.textContent=score;boom(r.x,r.y,'#a78bfa')}}}shots=shots.filter(b=>!b.dead);rocks=rocks.filter(r=>!r.dead);for(const r of rocks){if(Math.hypot(ship.x-r.x,ship.y-r.y)<ship.r+r.r){r.dead=true;lives--;livesEl.textContent=lives;boom(ship.x,ship.y,'#22d3ee');if(lives<=0){end();return}}else if(r.y>650){r.dead=true}}rocks=rocks.filter(r=>!r.dead);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*1.8});parts=parts.filter(p=>p.a>0)}function draw(){x.clearRect(0,0,960,600);stars.forEach(s=>{x.fillStyle='#fff';x.globalAlpha=.3+s.s*.2;x.fillRect(s.x,s.y,s.s,s.s)});x.globalAlpha=1;shots.forEach(b=>{x.fillStyle='#67e8f9';x.fillRect(b.x-3,b.y-14,6,20)});rocks.forEach(r=>{x.fillStyle='#6b7280';x.beginPath();x.arc(r.x,r.y,r.r,0,Math.PI*2);x.fill();x.fillStyle='#9ca3af';x.beginPath();x.arc(r.x-r.r*.25,r.y-r.r*.2,r.r*.24,0,Math.PI*2);x.fill()});x.save();x.translate(ship.x,ship.y);x.fillStyle='#e2e8f0';x.beginPath();x.moveTo(0,-28);x.lineTo(22,22);x.lineTo(0,13);x.lineTo(-22,22);x.closePath();x.fill();x.fillStyle='#22d3ee';x.fillRect(-7,7,14,18);x.restore();parts.forEach(p=>{x.globalAlpha=p.a;x.fillStyle=p.c;x.fillRect(p.x,p.y,5,5)});x.globalAlpha=1}function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.03);last=t;update(dt);draw();requestAnimationFrame(loop)}function start(){reset();running=true;overlay.style.display='none';requestAnimationFrame(loop)}function end(){running=false;let best=Math.max(score,+localStorage.getItem('gu-blaster-best')||0);localStorage.setItem('gu-blaster-best',best);overlay.style.display='grid';overlay.querySelector('h1').textContent='Mission over';overlay.querySelector('p').textContent=`Score ${score} • Best ${best}`;document.getElementById('start').textContent='Launch again'}document.getElementById('start').onclick=start;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();shoot()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let drag=false;c.onpointerdown=e=>{drag=true;move(e);shoot()};c.onpointermove=e=>drag&&move(e);c.onpointerup=()=>drag=false;function move(e){let r=c.getBoundingClientRect();ship.x=(e.clientX-r.left)/r.width*960;ship.y=(e.clientY-r.top)/r.height*600}reset();draw();</script></body></html>
