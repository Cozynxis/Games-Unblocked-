<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dodge Rush</title><style>*{box-sizing:border-box}body{margin:0;background:#160b22;color:white;font-family:system-ui;min-height:100vh;display:grid;place-items:center}.wrap{width:min(760px,calc(100% - 20px))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.back,.stat{background:#2a173d;border:1px solid #ffffff18;color:#fff;border-radius:12px;padding:10px 13px;text-decoration:none}.stage{position:relative;border:1px solid #ffffff18;background:#251331;padding:10px;border-radius:20px;box-shadow:0 24px 70px #0008}canvas{display:block;width:100%;aspect-ratio:1/1;background:radial-gradient(circle at center,#2b173b,#12091d);border-radius:14px}.overlay{position:absolute;inset:10px;display:grid;place-items:center;background:#100719ce;border-radius:14px;text-align:center}.overlay h1{font-size:42px;margin:0}.overlay p{color:#c9b8d9}.play{border:0;background:linear-gradient(135deg,#ff5f8f,#fb923c);color:white;padding:12px 18px;border-radius:12px;font-weight:900;cursor:pointer}.hint{text-align:center;color:#ad95be;font-size:12px;margin-top:10px}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../index.html">← Games</a><div><span class="stat">Score <b id="score">0</b></span> <span class="stat">Best <b id="best">0</b></span></div></div><div class="stage"><canvas id="c" width="700" height="700"></canvas><div class="overlay" id="overlay"><div><h1>⚡ Dodge Rush</h1><p>Dodge red hazards. Grab gold stars for bonus points.</p><button id="start" class="play">Start</button></div></div></div><div class="hint">WASD / arrows • mouse or touch also works</div></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay');let best=+localStorage.getItem('gu-dodge-best')||0;bestEl.textContent=best;let p,hazards,stars,parts,keys={},score,running,last,spawn,starT,target=null;function reset(){p={x:350,y:350,r:16};hazards=[];stars=[];parts=[];score=0;spawn=.3;starT=2;last=performance.now();scoreEl.textContent=0}function addHazard(){let side=Math.floor(Math.random()*4),h={r:12+Math.random()*14,s:150+Math.random()*90+score*.15};if(side===0){h.x=Math.random()*700;h.y=-30}else if(side===1){h.x=730;h.y=Math.random()*700}else if(side===2){h.x=Math.random()*700;h.y=730}else{h.x=-30;h.y=Math.random()*700}let a=Math.atan2(p.y-h.y,p.x-h.x)+(Math.random()-.5)*.35;h.vx=Math.cos(a)*h.s;h.vy=Math.sin(a)*h.s;hazards.push(h)}function addStar(){stars.push({x:45+Math.random()*610,y:45+Math.random()*610,r:11,t:8})}function burst(px,py,col){for(let i=0;i<10;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,a:1,c:col})}function update(dt){let dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);if(target){dx=(target.x-p.x)/80;dy=(target.y-p.y)/80}let len=Math.hypot(dx,dy)||1;p.x+=dx/Math.max(1,len)*310*dt;p.y+=dy/Math.max(1,len)*310*dt;p.x=Math.max(p.r,Math.min(700-p.r,p.x));p.y=Math.max(p.r,Math.min(700-p.r,p.y));score+=dt*10;scoreEl.textContent=Math.floor(score);spawn-=dt;if(spawn<=0){addHazard();spawn=Math.max(.19,.75-score*.002)+Math.random()*.25}starT-=dt;if(starT<=0){addStar();starT=2.4+Math.random()*2}hazards.forEach(h=>{h.x+=h.vx*dt;h.y+=h.vy*dt});hazards=hazards.filter(h=>h.x>-70&&h.x<770&&h.y>-70&&h.y<770);for(const h of hazards)if(Math.hypot(h.x-p.x,h.y-p.y)<h.r+p.r){burst(p.x,p.y,'#ff5f76');end();return}stars.forEach(s=>s.t-=dt);for(const s of stars)if(!s.hit&&Math.hypot(s.x-p.x,s.y-p.y)<s.r+p.r){s.hit=true;score+=50;burst(s.x,s.y,'#ffd166')}stars=stars.filter(s=>!s.hit&&s.t>0);parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.a-=dt*2});parts=parts.filter(q=>q.a>0)}function draw(){x.clearRect(0,0,700,700);x.strokeStyle='#ffffff0b';for(let i=0;i<=14;i++){x.beginPath();x.moveTo(i*50,0);x.lineTo(i*50,700);x.stroke();x.beginPath();x.moveTo(0,i*50);x.lineTo(700,i*50);x.stroke()}stars.forEach(s=>{x.save();x.translate(s.x,s.y);x.rotate(performance.now()/500);x.fillStyle='#ffd166';x.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?5:12;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill();x.restore()});hazards.forEach(h=>{x.fillStyle='#ff4567';x.shadowBlur=16;x.shadowColor='#ff4567';x.beginPath();x.arc(h.x,h.y,h.r,0,Math.PI*2);x.fill()});x.shadowBlur=0;x.fillStyle='#62e6ff';x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(p.x-5,p.y-4,3,0,Math.PI*2);x.arc(p.x+5,p.y-4,3,0,Math.PI*2);x.fill();parts.forEach(q=>{x.globalAlpha=q.a;x.fillStyle=q.c;x.fillRect(q.x,q.y,5,5)});x.globalAlpha=1}function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.03);last=t;update(dt);draw();requestAnimationFrame(loop)}function start(){reset();running=true;overlay.style.display='none';requestAnimationFrame(loop)}function end(){running=false;best=Math.max(best,Math.floor(score));localStorage.setItem('gu-dodge-best',best);bestEl.textContent=best;overlay.style.display='grid';overlay.querySelector('h1').textContent='Ouch!';overlay.querySelector('p').textContent=`Score ${Math.floor(score)} • Best ${best}`;document.getElementById('start').textContent='Try again'}document.getElementById('start').onclick=start;addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function setTarget(e){let r=c.getBoundingClientRect();target={x:(e.clientX-r.left)/r.width*700,y:(e.clientY-r.top)/r.height*700}}c.onpointerdown=e=>{setTarget(e);c.setPointerCapture?.(e.pointerId)};c.onpointermove=e=>{if(e.buttons)setTarget(e)};c.onpointerup=()=>target=null;reset();draw();</script></body></html>
