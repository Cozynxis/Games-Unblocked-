<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Hopper</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#93c5fd,#d9f99d);font-family:system-ui;color:#13213a;min-height:100vh;display:grid;place-items:center}.wrap{width:min(720px,calc(100% - 20px))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.back,.stat{background:#fff;border:2px solid #13213a;color:#13213a;border-radius:12px;padding:9px 12px;text-decoration:none;font-weight:800}.stage{position:relative;border:7px solid #13213a;border-radius:20px;overflow:hidden;box-shadow:0 20px 50px #0003}canvas{display:block;width:100%;aspect-ratio:4/5;background:linear-gradient(#7dd3fc,#f0fdf4)}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#ffffffd8;text-align:center}.overlay h1{font-size:40px;margin:0}.play{padding:12px 18px;border:0;border-radius:12px;background:#22c55e;color:#fff;font-weight:900;cursor:pointer}.hint{text-align:center;font-weight:700;margin-top:10px}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../index.html">← Games</a><span class="stat">Height <b id="score">0</b></span></div><div class="stage"><canvas id="c" width="600" height="750"></canvas><div id="overlay" class="overlay"><div><h1>☁️ Sky Hopper</h1><p>Keep bouncing upward. Don't fall!</p><button id="start" class="play">Start hopping</button></div></div></div><div class="hint">A/D or ←/→ • drag on mobile</div></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),overlay=document.getElementById('overlay');let p,plats,keys={},running,last,height,cam;function reset(){p={x:280,y:620,w:38,h:42,vx:0,vy:-650};plats=[];for(let i=0;i<12;i++)plats.push({x:40+Math.random()*430,y:700-i*70,w:90+Math.random()*45,h:14});height=0;cam=0;scoreEl.textContent=0;last=performance.now()}function update(dt){let dir=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);p.vx+=dir*1200*dt;p.vx*=Math.pow(.001,dt);p.x+=p.vx*dt;p.vy+=1550*dt;p.y+=p.vy*dt;if(p.x<-40)p.x=600;if(p.x>600)p.x=-40;if(p.vy>0){for(const q of plats){if(p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>q.y-cam&&p.y+p.h-p.vy*dt<=q.y-cam+8){p.y=q.y-cam-p.h;p.vy=-690;break}}}if(p.y<270){let shift=270-p.y;p.y=270;cam+=shift;height+=shift;scoreEl.textContent=Math.floor(height/10);for(const q of plats){}while(Math.min(...plats.map(q=>q.y))>cam-50)plats.push({x:30+Math.random()*450,y:Math.min(...plats.map(q=>q.y))-65-Math.random()*35,w:80+Math.random()*55,h:14});plats=plats.filter(q=>q.y-cam<820)}if(p.y>790)end()}function draw(){x.clearRect(0,0,600,750);for(let i=0;i<7;i++){x.fillStyle='#fff9';x.beginPath();x.ellipse((i*110+40)%650,90+(i%3)*115,45,18,0,0,Math.PI*2);x.fill()}plats.forEach(q=>{let y=q.y-cam;x.fillStyle='#166534';x.fillRect(q.x,y,q.w,q.h);x.fillStyle='#86efac';x.fillRect(q.x,y,q.w,5)});x.fillStyle='#f97316';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#fff';x.fillRect(p.x+7,p.y+8,24,16);x.fillStyle='#111827';x.fillRect(p.x+23,p.y+12,5,5)}function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.03);last=t;update(dt);draw();requestAnimationFrame(loop)}function start(){reset();running=true;overlay.style.display='none';requestAnimationFrame(loop)}function end(){running=false;let s=Math.floor(height/10),b=Math.max(s,+localStorage.getItem('gu-jump-best')||0);localStorage.setItem('gu-jump-best',b);overlay.style.display='grid';overlay.querySelector('h1').textContent='You fell!';overlay.querySelector('p').textContent=`Height ${s} • Best ${b}`;document.getElementById('start').textContent='Hop again'}document.getElementById('start').onclick=start;addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let dragging=false;c.onpointerdown=e=>{dragging=true;move(e)};c.onpointermove=e=>dragging&&move(e);c.onpointerup=()=>dragging=false;function move(e){let r=c.getBoundingClientRect();let tx=(e.clientX-r.left)/r.width*600;p.vx+=(tx-(p.x+p.w/2))*4}reset();draw();</script></body></html>
