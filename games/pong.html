<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080914"><title>Brick Bounce • Games Unblocked</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080914;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;overflow:hidden}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 25%,rgba(121,76,255,.15),transparent 32%),linear-gradient(#080914,#0a0d18)}.wrap{width:min(920px,calc(100% - 24px));padding:12px 0}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}.back,.btn{border:1px solid rgba(255,255,255,.09);background:#121426;color:#fff;border-radius:12px;padding:10px 13px;text-decoration:none;cursor:pointer;transition:.2s}.back:hover,.btn:hover{transform:translateY(-2px);background:#1a1e34}.title{margin-left:10px}.left{display:flex;align-items:center}.title strong{display:block}.title span{font-size:10px;color:#7c84a1}.stats{display:flex;gap:8px}.stat{background:#121426;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;min-width:72px;text-align:center}.stat span{display:block;font-size:9px;color:#7c84a1}.stage{position:relative;background:#0d1020;border:1px solid rgba(255,255,255,.08);padding:14px;border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.48);overflow:hidden}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.03) 48%,transparent 70%);animation:shine 7s infinite}canvas{position:relative;z-index:1;width:100%;aspect-ratio:16/10;display:block;background:radial-gradient(circle at 50% 60%,rgba(121,76,255,.16),transparent 45%),#090b18;border-radius:14px;touch-action:none}.overlay{position:absolute;z-index:4;inset:14px;display:grid;place-items:center;background:rgba(6,7,14,.72);backdrop-filter:blur(8px);border-radius:14px;transition:.25s}.overlay.hidden{opacity:0;pointer-events:none}.card{text-align:center;padding:24px}.card h1{font-size:42px;margin:0 0 8px;letter-spacing:-.04em}.card p{margin:0 0 18px;color:#8d95aa;font-size:13px}.play{border:0;background:linear-gradient(135deg,#8a62ff,#32b8ff);color:white;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer;box-shadow:0 12px 36px rgba(120,91,255,.2);transition:.2s}.play:hover{transform:translateY(-2px) scale(1.03)}.hint{text-align:center;color:#69728a;font-size:11px;margin-top:12px}.pause{position:absolute;z-index:3;top:26px;left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;padding:7px 11px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(10,12,23,.84);font-size:9px;font-weight:800;letter-spacing:.1em;transition:.2s}.pause.show{opacity:1;transform:translateX(-50%)}@keyframes shine{0%,65%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}@media(max-width:650px){.title{display:none}.stage{padding:8px}.overlay{inset:8px}.stat{min-width:58px;padding:8px}.stats{gap:5px}.card h1{font-size:31px}.hint{font-size:9px}}
</style>
</head>
<body><div class="bg"></div><main class="wrap"><div class="top"><div class="left"><a class="back" href="../index.html">← Library</a><div class="title"><strong>Brick Bounce</strong><span>Classic • breakout</span></div></div><div class="stats"><div class="stat"><span>SCORE</span><strong id="score">0</strong></div><div class="stat"><span>BEST</span><strong id="best">0</strong></div><div class="stat"><span>LIVES</span><strong id="lives">3</strong></div><button class="btn" id="full">⛶</button></div></div><div class="stage" id="stage"><canvas id="game" width="960" height="600"></canvas><div class="pause" id="pause">PAUSED</div><div class="overlay" id="overlay"><div class="card"><h1 id="title">Brick Bounce</h1><p id="message">Move with mouse, touch, ← → or A / D</p><button class="play" id="start">Start game</button></div></div></div><div class="hint">Clear every brick • Paddle angle changes the shot • Space = pause</div></main>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives'),overlay=document.getElementById('overlay'),titleEl=document.getElementById('title'),messageEl=document.getElementById('message'),startBtn=document.getElementById('start'),pauseEl=document.getElementById('pause');
const ROWS=6,COLS=10;let paddle,ball,bricks=[],particles=[],keys={},score=0,lives=3,best=Number(localStorage.getItem('gu-bounce-best'))||0,running=false,paused=false,last=0,raf=0;bestEl.textContent=best;
function makePaddle(){paddle={x:c.width/2-82,y:c.height-44,w:164,h:16,speed:650,target:null}}
function resetBall(){ball={x:c.width/2,y:c.height-90,vx:(Math.random()>.5?1:-1)*330,vy:-330,r:10,speed:466}}
function build(){bricks=[];const gap=12,margin=40,w=(c.width-margin*2-gap*(COLS-1))/COLS,h=25;for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++)bricks.push({x:margin+col*(w+gap),y:58+r*39,w,h,hit:false,hue:258-r*15})}
function reset(){score=0;lives=3;particles=[];scoreEl.textContent='0';livesEl.textContent='3';makePaddle();build();resetBall();draw()}
function burst(x,y,hue){for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*240,vy:(Math.random()-.5)*240,life:1,hue,size:2+Math.random()*3})}
function rectHitCircle(b){const nx=Math.max(b.x,Math.min(ball.x,b.x+b.w)),ny=Math.max(b.y,Math.min(ball.y,b.y+b.h)),dx=ball.x-nx,dy=ball.y-ny;return dx*dx+dy*dy<=ball.r*ball.r}
function update(dt){if(keys.arrowleft||keys.a){paddle.target=null;paddle.x-=paddle.speed*dt}if(keys.arrowright||keys.d){paddle.target=null;paddle.x+=paddle.speed*dt}if(paddle.target!==null){paddle.x+=(paddle.target-paddle.w/2-paddle.x)*Math.min(1,dt*14)}paddle.x=Math.max(0,Math.min(c.width-paddle.w,paddle.x));
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x+ball.r>c.width){ball.x=c.width-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x+ball.r>=paddle.x&&ball.x-ball.r<=paddle.x+paddle.w){ball.y=paddle.y-ball.r;const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);const speed=Math.min(650,Math.hypot(ball.vx,ball.vy)*1.018);const angle=hit*1.05;ball.vx=Math.sin(angle)*speed;ball.vy=-Math.abs(Math.cos(angle)*speed)}
for(const b of bricks){if(b.hit||!rectHitCircle(b))continue;b.hit=true;score+=10;scoreEl.textContent=String(score);if(score>best){best=score;bestEl.textContent=String(best);localStorage.setItem('gu-bounce-best',String(best))}burst(ball.x,ball.y,b.hue);const cx=b.x+b.w/2,cy=b.y+b.h/2,dx=(ball.x-cx)/(b.w/2),dy=(ball.y-cy)/(b.h/2);if(Math.abs(dx)>Math.abs(dy))ball.vx*=-1;else ball.vy*=-1;break}
if(bricks.every(b=>b.hit))finish('You cleared it!');if(ball.y-ball.r>c.height){lives--;livesEl.textContent=String(lives);if(lives<=0)finish('Game over');else resetBall()}
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=250*dt;p.life-=1.8*dt});particles=particles.filter(p=>p.life>0)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='rgba(255,255,255,.025)';for(let i=0;i<20;i++)ctx.fillRect(i*48,0,1,c.height);bricks.forEach(b=>{if(b.hit)return;const g=ctx.createLinearGradient(b.x,b.y,b.x+b.w,b.y+b.h);g.addColorStop(0,`hsl(${b.hue} 85% 66%)`);g.addColorStop(1,`hsl(${b.hue+25} 85% 54%)`);ctx.fillStyle=g;ctx.shadowBlur=12;ctx.shadowColor=`hsla(${b.hue} 90% 60%/.32)`;rr(b.x,b.y,b.w,b.h,7)});ctx.shadowBlur=0;const pg=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x+paddle.w,paddle.y);pg.addColorStop(0,'#a782ff');pg.addColorStop(1,'#35c6ff');ctx.fillStyle=pg;rr(paddle.x,paddle.y,paddle.w,paddle.h,8);ctx.fillStyle='#fff';ctx.shadowBlur=20;ctx.shadowColor='#9f83ff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=`hsl(${p.hue} 90% 65%)`;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1}
function loop(t){if(!running)return;if(!last)last=t;const dt=Math.min(.032,(t-last)/1000);last=t;if(!paused)update(dt);draw();if(running)raf=requestAnimationFrame(loop)}
function start(){cancelAnimationFrame(raf);reset();running=true;paused=false;pauseEl.classList.remove('show');overlay.classList.add('hidden');last=0;raf=requestAnimationFrame(loop)}
function finish(text){running=false;cancelAnimationFrame(raf);titleEl.textContent=text;messageEl.textContent=`Final score: ${score} • Best: ${best}`;startBtn.textContent='Play again';overlay.classList.remove('hidden')}
function togglePause(){if(!running)return;paused=!paused;pauseEl.classList.toggle('show',paused);last=performance.now()}
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.code==='Space'){e.preventDefault();togglePause()}});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function pointer(e){const r=c.getBoundingClientRect();paddle.target=(e.clientX-r.left)/r.width*c.width}c.addEventListener('pointerdown',pointer);c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)pointer(e)});startBtn.onclick=start;document.getElementById('full').onclick=()=>document.getElementById('stage').requestFullscreen?.().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)togglePause()});reset();})();
</script></body></html>
