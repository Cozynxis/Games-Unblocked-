<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brick Bounce • Games Unblocked</title><style>*{box-sizing:border-box}body{margin:0;background:#080914;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.wrap{width:min(920px,calc(100% - 24px))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.back,.btn{border:1px solid rgba(255,255,255,.09);background:#121426;color:#fff;border-radius:12px;padding:10px 13px;text-decoration:none;cursor:pointer}.title{margin-left:10px}.left{display:flex;align-items:center}.title strong{display:block}.title span{font-size:10px;color:#7c84a1}.stats{display:flex;gap:8px}.stat{background:#121426;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;min-width:72px;text-align:center}.stat span{display:block;font-size:9px;color:#7c84a1}.stage{position:relative;background:#0d1020;border:1px solid rgba(255,255,255,.08);padding:14px;border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.48)}canvas{width:100%;aspect-ratio:16/10;display:block;background:radial-gradient(circle at 50% 60%,rgba(121,76,255,.16),transparent 45%),#090b18;border-radius:14px}.overlay{position:absolute;inset:14px;display:grid;place-items:center;background:rgba(6,7,14,.7);backdrop-filter:blur(6px);border-radius:14px}.card{text-align:center}.card h1{font-size:42px;margin:0 0 8px}.card p{margin:0 0 18px;color:#8d95aa}.play{border:0;background:linear-gradient(135deg,#8a62ff,#32b8ff);color:white;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer}.hint{text-align:center;color:#69728a;font-size:11px;margin-top:12px}</style></head><body><main class="wrap"><div class="top"><div class="left"><a class="back" href="../index.html">← Library</a><div class="title"><strong>Brick Bounce</strong><span>Classic</span></div></div><div class="stats"><div class="stat"><span>SCORE</span><strong id="score">0</strong></div><div class="stat"><span>LIVES</span><strong id="lives">3</strong></div><button class="btn" id="full">⛶</button></div></div><div class="stage" id="stage"><canvas id="game" width="960" height="600"></canvas><div class="overlay" id="overlay"><div class="card"><h1>Brick Bounce</h1><p>Move with ← → or A / D</p><button class="play" id="start">Start game</button></div></div></div><div class="hint">Clear the wall • Keep the ball alive • Space = pause</div></main><script>const c=document.getElementById('game'),x=c.getContext('2d');let paddle,ball,bricks,keys={},score=0,lives=3,running=false,paused=false,raf;const rows=5,cols=10;function resetBall(){ball={x:c.width/2,y:c.height-95,vx:(Math.random()>.5?1:-1)*5,vy:-5,r:10}}function build(){bricks=[];for(let r=0;r<rows;r++)for(let col=0;col<cols;col++)bricks.push({x:40+col*88,y:55+r*38,w:72,h:22,hit:false,hue:255-r*18})}function reset(){paddle={x:c.width/2-75,y:c.height-42,w:150,h:16,s:9};score=0;lives=3;scoreEl.textContent=0;livesEl.textContent=3;build();resetBall()}const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives');function roundRect(ctx,X,Y,w,h,r){ctx.beginPath();ctx.roundRect(X,Y,w,h,r);ctx.fill()}function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='rgba(255,255,255,.025)';for(let i=0;i<20;i++)x.fillRect(i*48,0,1,c.height);bricks.forEach(b=>{if(b.hit)return;const g=x.createLinearGradient(b.x,b.y,b.x+b.w,b.y+b.h);g.addColorStop(0,`hsl(${b.hue} 85% 66%)`);g.addColorStop(1,`hsl(${b.hue+25} 85% 54%)`);x.fillStyle=g;x.shadowBlur=14;x.shadowColor=`hsla(${b.hue} 90% 60%/.35)`;roundRect(x,b.x,b.y,b.w,b.h,7)});x.shadowBlur=0;const pg=x.createLinearGradient(paddle.x,paddle.y,paddle.x+paddle.w,paddle.y);pg.addColorStop(0,'#a782ff');pg.addColorStop(1,'#35c6ff');x.fillStyle=pg;roundRect(x,paddle.x,paddle.y,paddle.w,paddle.h,8);x.fillStyle='#fff';x.shadowBlur=20;x.shadowColor='#9f83ff';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.shadowBlur=0}function update(){if(keys.arrowleft||keys.a)paddle.x-=paddle.s;if(keys.arrowright||keys.d)paddle.x+=paddle.s;paddle.x=Math.max(0,Math.min(c.width-paddle.w,paddle.x));ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x-ball.r<0||ball.x+ball.r>c.width)ball.vx*=-1;if(ball.y-ball.r<0)ball.vy*=-1;if(ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w&&ball.vy>0){const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*7;ball.vy=-Math.abs(ball.vy)*1.025}for(const b of bricks){if(!b.hit&&ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.hit=true;ball.vy*=-1;score+=10;scoreEl.textContent=score;break}}if(bricks.every(b=>b.hit)){finish('You cleared it!')}if(ball.y-ball.r>c.height){lives--;livesEl.textContent=lives;if(lives<=0)finish('Game over');else resetBall()}}function loop(){if(!running)return;if(!paused)update();draw();raf=requestAnimationFrame(loop)}function start(){cancelAnimationFrame(raf);reset();running=true;paused=false;overlay.style.display='none';loop()}function finish(text){running=false;cancelAnimationFrame(raf);overlay.style.display='grid';overlay.querySelector('h1').textContent=text;overlay.querySelector('p').textContent='Final score: '+score;startBtn.textContent='Play again'}const overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');startBtn.onclick=start;document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){paused=!paused;e.preventDefault()}});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.getElementById('full').onclick=()=>document.getElementById('stage').requestFullscreen?.();reset();draw();</script></body></html>
