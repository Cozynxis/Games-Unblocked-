<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Runner</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#7dd3fc,#dbeafe);font-family:system-ui;color:#fff;min-height:100vh;display:grid;place-items:center}.wrap{width:min(920px,calc(100% - 20px))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.back,.btn,.stat{background:#111827;color:#fff;border:0;border-radius:12px;padding:10px 14px;text-decoration:none}.stat{display:inline-flex;gap:8px}.stage{position:relative;border:8px solid #111827;border-radius:20px;overflow:hidden;box-shadow:0 20px 50px #0003}canvas{display:block;width:100%;aspect-ratio:16/9;background:linear-gradient(#7dd3fc 0 68%,#86efac 68% 76%,#65a30d 76%)}.overlay{position:absolute;inset:0;background:#111827bb;display:grid;place-items:center;text-align:center}.card h1{font-size:44px;margin:0}.card p{color:#cbd5e1}.play{padding:12px 20px;border:0;border-radius:12px;background:#facc15;font-weight:900;cursor:pointer}.hint{text-align:center;color:#1f2937;font-weight:700;margin-top:10px}@media(max-width:600px){.card h1{font-size:32px}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../index.html">← Games</a><div><span class="stat">Score <b id="score">0</b></span> <span class="stat">Best <b id="best">0</b></span></div></div><div class="stage"><canvas id="c" width="960" height="540"></canvas><div class="overlay" id="overlay"><div class="card"><h1>🏃 Pixel Runner</h1><p>Jump over everything. The game gets faster.</p><button class="play" id="start">Start run</button></div></div></div><div class="hint">SPACE / ↑ / W / tap = jump</div></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');let best=+localStorage.getItem('gu-runner-best')||0;bestEl.textContent=best;let p,obs,particles,score,speed,running,last,spawnT;function reset(){p={x:120,y:410,w:44,h:56,vy:0,on:true};obs=[];particles=[];score=0;speed=360;last=performance.now();spawnT=0;scoreEl.textContent=0}function jump(){if(!running)return;if(p.on){p.vy=-760;p.on=false;for(let i=0;i<8;i++)particles.push({x:p.x+20,y:465,vx:(Math.random()-.5)*140,vy:-Math.random()*160,a:1})}}function spawn(){let h=40+Math.random()*50;obs.push({x:1000,y:466-h,w:28+Math.random()*35,h})}function hit(a,b){return a.x<a.x+b.w&&a.x+a.w>b.x&&a.y<a.y+b.h&&a.y+a.h>b.y}function update(dt){speed+=dt*7;score+=dt*10;scoreEl.textContent=Math.floor(score);p.vy+=1800*dt;p.y+=p.vy*dt;if(p.y>=410){p.y=410;p.vy=0;p.on=true}spawnT-=dt;if(spawnT<=0){spawn();spawnT=.9+Math.random()*1.1}obs.forEach(o=>o.x-=speed*dt);obs=obs.filter(o=>o.x>-80);particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;q.a-=dt*1.7});particles=particles.filter(q=>q.a>0);for(const o of obs)if(p.x<o.x+o.w&&p.x+p.w>o.x&&p.y<o.y+o.h&&p.y+p.h>o.y){end();break}}function draw(){x.clearRect(0,0,c.width,c.height);for(let i=0;i<8;i++){x.fillStyle='#fff8';x.beginPath();x.ellipse((i*160-(score*8)%1280),90+(i%3)*55,50,18,0,0,Math.PI*2);x.fill()}x.fillStyle='#4ade80';for(let i=0;i<20;i++)x.fillRect(i*70-(score*22)%70,448,40,8);x.fillStyle='#111827';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#fde68a';x.fillRect(p.x+8,p.y+7,28,25);x.fillStyle='#111';x.fillRect(p.x+28,p.y+13,5,5);obs.forEach(o=>{x.fillStyle='#7c3aed';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#a78bfa';for(let y=o.y+7;y<o.y+o.h;y+=16)x.fillRect(o.x+6,y,o.w-12,5)});particles.forEach(q=>{x.globalAlpha=q.a;x.fillStyle='#365314';x.fillRect(q.x,q.y,6,6)});x.globalAlpha=1}function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.03);last=t;update(dt);draw();requestAnimationFrame(loop)}function start(){reset();running=true;overlay.style.display='none';requestAnimationFrame(loop)}function end(){running=false;best=Math.max(best,Math.floor(score));localStorage.setItem('gu-runner-best',best);bestEl.textContent=best;overlay.style.display='grid';overlay.querySelector('h1').textContent='Run over!';overlay.querySelector('p').textContent='Score: '+Math.floor(score)+' • Best: '+best;document.getElementById('start').textContent='Run again'}document.getElementById('start').onclick=start;addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}});c.addEventListener('pointerdown',jump);reset();draw();</script></body></html>
