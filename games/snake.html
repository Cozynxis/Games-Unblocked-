<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Snake • Games Unblocked</title><style>*{box-sizing:border-box}body{margin:0;background:#070a10;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;overflow:hidden}.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(37,255,195,.13),transparent 30%),linear-gradient(#070a10,#090d16);z-index:-1}.wrap{width:min(900px,calc(100% - 24px))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.left{display:flex;gap:10px;align-items:center}.back,.btn{border:1px solid rgba(255,255,255,.1);background:#111722;color:#fff;border-radius:12px;padding:10px 13px;text-decoration:none;cursor:pointer}.title strong{display:block;font-size:15px}.title span{font-size:10px;color:#758195}.score{display:flex;gap:9px}.score div{background:#111722;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 13px;text-align:center;min-width:76px}.score span{display:block;color:#758195;font-size:9px;text-transform:uppercase}.score strong{font-size:17px}.stage{position:relative;border:1px solid rgba(255,255,255,.09);background:#0b1118;border-radius:22px;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,.5)}canvas{display:block;width:100%;aspect-ratio:1/1;max-height:72vh;background:#07100f;border-radius:14px}.overlay{position:absolute;inset:16px;display:grid;place-items:center;background:rgba(4,8,10,.68);backdrop-filter:blur(7px);border-radius:14px}.card{text-align:center}.card h1{font-size:42px;margin:0 0 8px}.card p{color:#8b98aa;margin:0 0 18px}.play{border:0;background:linear-gradient(135deg,#39e8aa,#21a8ff);color:#03110d;font-weight:800;border-radius:12px;padding:12px 18px;cursor:pointer}.hint{text-align:center;color:#647083;font-size:11px;margin-top:12px}@media(max-width:600px){.title{display:none}.score div{min-width:60px;padding:8px}.stage{padding:8px}.overlay{inset:8px}.card h1{font-size:31px}}</style></head><body><div class="bg"></div><main class="wrap"><div class="top"><div class="left"><a class="back" href="../index.html">← Library</a><div class="title"><strong>Neon Snake</strong><span>Arcade</span></div></div><div class="score"><div><span>Score</span><strong id="score">0</strong></div><div><span>Best</span><strong id="best">0</strong></div><button class="btn" id="full">⛶</button></div></div><div class="stage" id="stage"><canvas id="game" width="600" height="600"></canvas><div class="overlay" id="overlay"><div class="card"><h1>Neon Snake</h1><p>Arrow keys / WASD to move</p><button class="play" id="start">Start game</button></div></div></div><div class="hint">Collect the orb • Don't hit the wall or yourself • Space = pause</div></main><script>const c=document.getElementById('game'),x=c.getContext('2d'),S=20,N=c.width/S;let snake,dir,next,food,score,running,timer,paused=false,best=+localStorage.getItem('gu-snake-best')||0;bestEl=document.getElementById('best');bestEl.textContent=best;function reset(){snake=[{x:14,y:15},{x:13,y:15},{x:12,y:15}];dir={x:1,y:0};next=dir;score=0;document.getElementById('score').textContent=0;spawn();draw()}function spawn(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function draw(){x.fillStyle='#07100f';x.fillRect(0,0,c.width,c.height);x.strokeStyle='rgba(255,255,255,.025)';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke()}x.shadowBlur=24;x.shadowColor='#3fffc5';x.fillStyle='#41ffc8';x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S*.32,0,Math.PI*2);x.fill();x.shadowBlur=0;snake.forEach((p,i)=>{const g=x.createLinearGradient(p.x*S,p.y*S,p.x*S+S,p.y*S+S);g.addColorStop(0,i?'#2fe4b1':'#95ffe3');g.addColorStop(1,i?'#168da6':'#2dd4ff');x.fillStyle=g;x.beginPath();x.roundRect(p.x*S+2,p.y*S+2,S-4,S-4,5);x.fill()})}function tick(){if(!running||paused)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){gameOver();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.getElementById('score').textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('gu-snake-best',best)}spawn()}else snake.pop();draw()}function start(){reset();running=true;paused=false;document.getElementById('overlay').style.display='none';clearInterval(timer);timer=setInterval(tick,90)}function gameOver(){running=false;clearInterval(timer);const o=document.getElementById('overlay');o.style.display='grid';o.querySelector('h1').textContent='Game over';o.querySelector('p').textContent='Score: '+score+' • Best: '+best;document.getElementById('start').textContent='Play again'}document.getElementById('start').onclick=start;document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m={arrowup:{x:0,y:-1},w:{x:0,y:-1},arrowdown:{x:0,y:1},s:{x:0,y:1},arrowleft:{x:-1,y:0},a:{x:-1,y:0},arrowright:{x:1,y:0},d:{x:1,y:0}}[k];if(m){e.preventDefault();if(!(m.x===-dir.x&&m.y===-dir.y))next=m}if(e.code==='Space'&&running){paused=!paused;e.preventDefault()}});document.getElementById('full').onclick=()=>document.getElementById('stage').requestFullscreen?.();reset();</script></body></html>
